services:
  drawdb:
    image: ghcr.io/artempas/drawdb-collaborative-with-auth:latest
    build: .
    restart: unless-stopped
    ports:
      - "3333:3000"
    environment:
      PORT: 3000
      DATABASE_PATH: /data/drawdb.sqlite
      # Optional: passphrase for encrypting stored git access tokens. When
      # unset, a key is generated once and kept in the database.
      GIT_SECRET_KEY: ${GIT_SECRET_KEY:-}
    volumes:
      - drawdb-data:/data

volumes:
  drawdb-data:
